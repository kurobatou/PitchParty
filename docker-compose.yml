services:
  karaoke-server:
    build: ./server
    container_name: karaoke-server
    ports:
      - "3000:3000"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./songs:/library/local:ro
      - ./server/src:/app/src:ro
      - ./server/public:/app/public:ro
      - karaoke-data:/data
    command: node --watch src/index.js
    environment:
      - ENGINE_WS_URL=ws://engine:8765
    depends_on:
      - engine
    restart: unless-stopped

  engine:
    build: ./engine
    container_name: karaoke-engine
    ports:
      - "8765:8765"
    volumes:
      - ./engine/src:/app/src:ro
    restart: unless-stopped

volumes:
  karaoke-data:
